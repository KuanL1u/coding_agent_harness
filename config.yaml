# Sample configuration for the coding agent harness.
# String values support ${ENV_VAR} expansion, so secrets stay out of this file.

llm:
  # Point this at any OpenAI-compatible endpoint:
  #   OpenAI:  https://api.openai.com/v1
  #   vLLM:    http://localhost:8000/v1
  #   SGLang:  http://localhost:30000/v1
  base_url: ${OPENAI_BASE_URL}
  api_key: ${OPENAI_API_KEY}
  model: llama-3.3-70b-versatile
  temperature: 0.0
  max_tokens: 2048
  parallel_tool_calls: true
  request_timeout: 120.0

loop:
  max_steps: 30
  max_total_tokens: 200000

sandbox:
  workspace_root: workspace
  command_timeout_s: 60.0
  max_output_bytes: 16000
  dry_run: false
  deny_patterns:
    - '\brm\s+-rf\s+/'
    - '\bmkfs\b'
    - '\bshutdown\b'
    - '\breboot\b'

logging:
  trace_file: runs/trace.jsonl
  console: true

memory:
  # Experience layer: persist a record of every run and inject the most
  # relevant past experience into future runs. Safe to leave on — it only
  # adds context and never modifies code.
  enabled: true
  store_path: memory
  # "local" / "" -> dependency-free local embedder (works on any endpoint,
  # including Groq which has no /v1/embeddings). Set to an embedding model
  # name (e.g. text-embedding-3-small) to use a real embeddings endpoint.
  embedding_model: local
  retrieve_k_episodes: 3
  retrieve_k_playbooks: 2
  inject_token_budget: 800
  distill_every_n_episodes: 25

evolve:
  # Prompt & policy self-tuning (Layer 3). Off by default: when disabled the
  # agent uses the hardcoded prompt + static config (v1 behaviour). Enable to
  # make the active, versioned prompt/policy the source of truth and to run the
  # evolution cycle (python -m coding_harness.evolve.evolver.cycle).
  enabled: false
  active_policy_version: ""   # empty -> use the registry's active pointer
  policy_dir: policy
  max_candidates_per_cycle: 4
  adopt_epsilon: 0.03         # require +3% benchmark success to adopt
  max_cost_regression: 0.10   # reject if >10% more tokens/steps
  cycle_budget_tokens: 2000000

tool_evolution:
  # Pluggable tools & memory-driven tool self-extension (Layer 4).
  # The pluggable registry (PT-M1) is always on: tools are discovered at runtime
  # from plugins_dir, with the built-ins loaded the same way an agent-authored
  # tool would be. 'enabled' gates the self-extension LOOP (gap detection ->
  # propose -> stage -> validate -> open PR), which is not built yet (PT-M2+).
  enabled: false
  require_approval: true       # a new tool only activates by merging a PR (v1 default)
  plugins_dir: ""              # empty -> packaged coding_harness/tools/plugins
  staging_dir: ""              # quarantine for proposed-but-unvalidated tools (PT-M2+)
  cadence: manual              # manual | nightly | every_n_runs
  max_new_tools_per_cycle: 2
  gap_evidence_threshold: 0.25 # a gap must recur in >=25% of recent runs to mint a tool
  run_benchmark_ab: true
  github_repo: ""              # owner/repo the PR is opened against (PT-M4)
